<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>小狗钱钱 · 财商大冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #f1ecd6;
            font-family: 'Courier New', 'Segoe UI', monospace;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            max-width: 700px;
            width: 100%;
            background: #fffcf0;
            border: 4px solid #2c2b28;
            border-radius: 48px;
            padding: 1.8rem 1.5rem 2rem;
            box-shadow: 12px 12px 0 #c9c1ad;
            position: relative;
            margin: 20px auto;
        }
        /* 音乐控制按钮 - 更大更明显 */
        .music-control {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,250,225,0.95);
            border: 2px solid #000;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 10;
            backdrop-filter: blur(2px);
            box-shadow: 2px 2px 0 #aaa;
            transition: 0.05s linear;
        }
        .music-control:active {
            transform: scale(0.95);
        }
        .compass {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 2rem;
            opacity: 0.5;
        }
        h1, h2 { 
            font-size: 1.5rem; 
            border-left: 6px solid #000; 
            padding-left: 0.8rem; 
            margin: 0.8rem 0 1.2rem; 
        }
        button {
            background: white;
            border: 2px solid #000;
            border-radius: 60px;
            padding: 8px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 #ccc;
            transition: 0.05s linear;
            font-size: 0.9rem;
        }
        button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #aaa; }
        button.primary { background: black; color: white; }
        .map-grid { display: flex; flex-direction: column; gap: 1.2rem; margin: 1.8rem 0; }
        .island {
            background: #fff2df;
            border: 2px solid #000;
            border-radius: 28px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.05s;
        }
        .island.locked { opacity: 0.6; filter: grayscale(0.2); background: #e2dccf; cursor: not-allowed; }
        .island.completed { background: #d9f0d9; border-color: #2c6e2c; }
        .island-icon { font-size: 2.2rem; min-width: 60px; text-align: center; }
        .island-info { flex: 1; }
        .island-name { font-weight: bold; font-size: 1.2rem; }
        .badge-progress {
            background: #1e1e1c;
            color: #ffefb9;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        .story-bubble {
            background: #fff1cf;
            border-left: 6px solid #000;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            margin: 1.2rem 0;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            font-size: 0.95rem;
        }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            border: 4px solid black;
            border-radius: 40px;
            padding: 1.8rem;
            max-width: 320px;
            text-align: center;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #111;
            background: #fff;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .card { 
            border: 2px solid #000; 
            border-radius: 28px; 
            padding: 1.2rem; 
            margin: 1.2rem 0; 
            background: #fefefe;
        }
        .game-area {
            background: #d9d2b0;
            border-radius: 32px;
            padding: 1.2rem;
            text-align: center;
            margin: 1.2rem 0;
        }
        .click-game {
            text-align: center;
            padding: 20px;
        }
        .monster-btn {
            background: #b5654b;
            border: 4px solid #3e2a1f;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 6px 6px 0 #5a3a2a;
        }
        .monster-btn:active {
            transform: scale(0.96);
            box-shadow: 2px 2px 0 #5a3a2a;
        }
        .timer-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
            border: 1px solid #000;
        }
        .timer-fill {
            width: 100%;
            height: 100%;
            background: #2c6e2c;
            transition: width 0.05s linear;
        }
        .flex-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .swords-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
        }
        .sword-card {
            background: #fff2df;
            border: 2px solid #000;
            border-radius: 28px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .sword-card:active { transform: scale(0.96); }
        .sword-card.collected {
            background: #d9f0d9;
            border-color: #2c6e2c;
            cursor: default;
            opacity: 0.7;
        }
        .sword-card .sword-name { font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        .sword-card .sword-desc { font-size: 0.75rem; color: #444; }
        .sword-detail-modal .modal-card { max-width: 320px; text-align: left; }
        .memory-grid {
            display: grid;
            gap: 14px;
            justify-content: center;
            margin: 20px auto;
        }
        .memory-card {
            background: #b87c4f;
            border: 3px solid #3e2a1f;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            color: #f9eec1;
            padding: 0.6rem;
            word-break: break-word;
            aspect-ratio: 1 / 1;
            min-width: 75px;
        }
        .memory-card.flipped, .memory-card.matched {
            background: #f9eec1;
            color: #2c2b28;
            border-color: #000;
        }
        .memory-card.matched {
            background: #7c9e6e;
            cursor: default;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width:550px){
            .memory-card { font-size: 0.7rem; min-width: 60px; }
            .memory-card.matched { font-size: 1.5rem; }
            .monster-btn { width: 140px; height: 140px; font-size: 4rem; }
            .swords-grid { grid-template-columns: 1fr; }
            .game-container { padding: 1.2rem; }
            .music-control { width: 38px; height: 38px; font-size: 1.3rem; top: 12px; left: 12px; }
            .compass { font-size: 1.5rem; top: 8px; right: 12px; }
        }
    </style>
</head>
<body>
<div id="gameRoot" class="game-container">
    <div class="music-control" id="musicControlBtn">🔊</div>
    <div class="compass">🧭🐕</div>
    <div id="dynamicContent"></div>
</div>

<script>
    const STORAGE_KEY = 'puppy_adventure_v10';

    // ---------- BGM 相关 ----------
    let bgm = null;
    let bgmPlaying = false;
    let bgmMuted = false;

    function initBGM() {
        if (!bgm) {
            bgm = new Audio('bgm.mp3');
            bgm.loop = true;
            bgm.volume = 0.4;
            bgm.addEventListener('ended', () => { if(bgm) bgm.currentTime = 0; });
        }
    }

    function playBGM() {
        if (!bgm) initBGM();
        if (bgm && !bgmPlaying && !bgmMuted) {
            bgm.play().catch(e => console.log("BGM 播放需要用户交互"));
            bgmPlaying = true;
        }
    }

    function stopBGM() {
        if (bgm && bgmPlaying) {
            bgm.pause();
            bgmPlaying = false;
        }
    }

    function toggleMusic() {
        if (!bgm) initBGM();
        if (bgmMuted) {
            bgmMuted = false;
            if (!bgmPlaying) {
                bgm.play().catch(e => console.log("播放失败"));
                bgmPlaying = true;
            }
            document.getElementById('musicControlBtn').innerText = '🔊';
        } else {
            bgmMuted = true;
            if (bgmPlaying) {
                bgm.pause();
                bgmPlaying = false;
            }
            document.getElementById('musicControlBtn').innerText = '🔇';
        }
    }

    function startBGMOnInteraction() {
        if (!bgmPlaying && !bgmMuted) {
            playBGM();
        }
    }

    // ---------- 游戏数据结构 ----------
    function getEmptyProgress() {
        return {
            userName: '',
            islandUnlocked: [true, false, false, false],
            islandCompleted: [false, false, false, false],
            badges: 0,
            currentChallenge: null,
            wish: { text: '', reason: '' },
            planningConfirmed: false,
            swordsCollected: {
                "梦想相册": false,
                "梦想储蓄罐": false,
                "成功日记": false,
                "72小时法则": false,
                "金鹅定律": false,
                "负债原则": false,
                "中性放大器": false
            },
            finalBadge: false
        };
    }

    let progress = getEmptyProgress();

    function loadProgress() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const saved = JSON.parse(raw);
                progress = { ...getEmptyProgress(), ...saved };
                if (saved.swordsCollected) progress.swordsCollected = { ...getEmptyProgress().swordsCollected, ...saved.swordsCollected };
            } catch(e) {}
        }
        progress.badges = progress.islandCompleted.filter(v=>v===true).length;
        if (progress.islandCompleted[0]) progress.islandUnlocked[1] = true;
        if (progress.islandCompleted[1]) progress.islandUnlocked[2] = true;
        if (progress.islandCompleted[2]) progress.islandUnlocked[3] = true;
        saveProgress();
    }
    function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }

    function showModal(msg, onClose) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-card"><div>🐕💰</div><p style="margin:15px 0;">${msg}</p><button id="modalClose">继续冒险</button></div>`;
        document.body.appendChild(modal);
        document.getElementById('modalClose').onclick = () => {
            modal.remove();
            if(onClose) onClose();
        };
    }

    function showSwordDetail(title, content, onClose) {
        const modal = document.createElement('div');
        modal.className = 'modal sword-detail-modal';
        modal.innerHTML = `
            <div class="modal-card">
                <div style="font-size:2rem;">⚔️</div>
                <h3 style="margin:10px 0;">${title}</h3>
                <p style="margin:15px 0; line-height:1.5;">${content}</p>
                <button id="detailCloseBtn">收下这把利剑</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('detailCloseBtn').onclick = () => {
            modal.remove();
            if(onClose) onClose();
        };
    }

    function render() {
        const container = document.getElementById('dynamicContent');
        if (!container) return;
        if (!progress.userName) {
            renderIntro(container);
            return;
        }
        if (progress.islandCompleted[0] && progress.islandCompleted[1] && progress.islandCompleted[2] && progress.islandCompleted[3] && !progress.finalBadge) {
            progress.finalBadge = true;
            saveProgress();
            renderVictory(container);
            return;
        }
        if (progress.finalBadge) {
            renderVictory(container);
            return;
        }
        if (progress.currentChallenge !== null) {
            switch(progress.currentChallenge) {
                case 1: renderWishIsland(container); break;
                case 2: renderMemoryGame(container); break;
                case 3: renderGoldenEggGame(container); break;
                case 4: renderPlanningTemple(container); break;
                default: renderMap(container);
            }
        } else {
            renderMap(container);
        }
    }

    function renderIntro(container) {
        container.innerHTML = `
            <div style="text-align:center; margin:10px 0;"><span style="font-size:4rem;">🐕‍🦺🗺️</span></div>
            <div class="story-bubble"><span>🐕</span><span>勇敢的旅行者，我是小狗钱钱！和我一起开始财商大冒险吧！首先告诉我你的名字。</span></div>
            <div class="card">
                <p><strong>作者：博多·舍费尔</strong> —— 欧洲首席金钱教练</p>
                <p>✨ 开发者：天明·语读会</p>
                <p>🎯 通过冒险游戏，成为财商骑士！</p>
            </div>
            <div style="margin:25px 0 20px;">
                <label>⚔️ 骑士之名：</label>
                <input type="text" id="knightName" placeholder="例如：小钱钱" autocomplete="off">
            </div>
            <button id="startBtn" class="primary" disabled>🚀 启程冒险</button>
        `;
        const inp = document.getElementById('knightName');
        const btn = document.getElementById('startBtn');
        const check = () => btn.disabled = !inp.value.trim();
        inp.addEventListener('input', check);
        check();
        btn.onclick = () => {
            const name = inp.value.trim();
            if(!name) return;
            startBGMOnInteraction();
            progress = getEmptyProgress();
            progress.userName = name;
            saveProgress();
            render();
        };
    }

    function renderMap(container) {
        const islands = [
            { name: "✨ 愿望岛", desc: "写下最重要的金钱愿望", icon: "🌟", completed: progress.islandCompleted[0], locked: false },
            { name: "🧠 记忆丛林", desc: "翻翻乐·强化关键记忆", icon: "📔", completed: progress.islandCompleted[1], locked: !progress.islandUnlocked[1] },
            { name: "🥚 金蛋河湾", desc: "快点点怪兽，保护大鹅！", icon: "🦢", completed: progress.islandCompleted[2], locked: !progress.islandUnlocked[2] },
            { name: "🏛️ 规划神殿", desc: "回顾愿望，坚定承诺", icon: "🗺️", completed: progress.islandCompleted[3], locked: !progress.islandUnlocked[3] }
        ];
        container.innerHTML = `
            <div class="story-bubble"><span>🐕</span><span>骑士 ${escapeHtml(progress.userName)}，你的冒险地图！完成岛屿获得勇气徽章。</span></div>
            <div class="badge-progress"><span>🏅 勇气徽章: ${progress.badges}/4</span><span>⚔️ 进度: ${progress.badges}/4</span></div>
            <div class="map-grid" id="mapGrid"></div>
            <button id="resetGameBtn">🔄 重新开始冒险</button>
        `;
        const grid = document.getElementById('mapGrid');
        islands.forEach((isl, idx) => {
            const div = document.createElement('div');
            div.className = `island ${isl.locked ? 'locked' : ''} ${isl.completed ? 'completed' : ''}`;
            if (!isl.locked && !isl.completed) div.style.cursor = 'pointer';
            div.innerHTML = `
                <div class="island-icon">${isl.icon}</div>
                <div class="island-info"><div class="island-name">${isl.name}</div><div class="island-desc">${isl.desc}</div></div>
                <div>${isl.completed ? '✅ 已完成' : (isl.locked ? '🔒 未解锁' : '▶ 进入')}</div>
            `;
            if (!isl.locked && !isl.completed) {
                div.addEventListener('click', () => {
                    startBGMOnInteraction();
                    progress.currentChallenge = idx+1;
                    saveProgress();
                    render();
                });
            }
            grid.appendChild(div);
        });
        document.getElementById('resetGameBtn').onclick = () => {
            if (bgm) { bgm.pause(); bgmPlaying = false; bgmMuted = false; document.getElementById('musicControlBtn').innerText = '🔊'; }
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        };
    }

    // 愿望岛
    function renderWishIsland(container) {
        const saved = progress.wish;
        container.innerHTML = `
            <div class="story-bubble"><span>🐕</span><span>✨ 写下你最重要的一个金钱愿望，以及它为什么如此重要。</span></div>
            <h2>🌟 愿望岛 · 最重要的愿望</h2>
            <label>我的愿望：</label>
            <input type="text" id="wishText" value="${escapeHtml(saved.text)}" placeholder="例如：存下一笔应急基金">
            <label>为什么这个愿望对我很重要？</label>
            <textarea id="wishReason" rows="3" placeholder="因为...">${escapeHtml(saved.reason)}</textarea>
            <button id="submitWishBtn" class="primary">✨ 许下愿望</button>
            <button id="backMapBtn">🗺️ 返回地图</button>
        `;
        document.getElementById('submitWishBtn').onclick = () => {
            const text = document.getElementById('wishText').value.trim();
            const reason = document.getElementById('wishReason').value.trim();
            if (!text || !reason) { alert("请完整填写愿望和原因～"); return; }
            progress.wish = { text, reason };
            progress.islandCompleted[0] = true;
            progress.badges++;
            progress.islandUnlocked[1] = true;
            progress.currentChallenge = null;
            saveProgress();
            showModal(`“${text}” 因为 ${reason}。记住这个愿望，它会像星星一样指引你！`, () => { render(); });
        };
        document.getElementById('backMapBtn').onclick = () => {
            progress.currentChallenge = null;
            saveProgress();
            render();
        };
    }

    // 记忆翻翻乐
    function renderMemoryGame(container) {
        const levels = [
            { name: "第1关：作者与书名", gridCols: 2, pairs: [{ text: "博多·舍费尔", matchId: 0 }, { text: "小狗钱钱", matchId: 1 }] },
            { name: "第2关：财商概念大挑战", gridCols: 4, pairs: [
                { text: "梦想相册", matchId: 0 }, { text: "梦想储蓄罐", matchId: 1 },
                { text: "成功日记", matchId: 2 }, { text: "72小时法则", matchId: 3 },
                { text: "金鹅定律", matchId: 4 }, { text: "负债原则", matchId: 5 },
                { text: "中性放大器", matchId: 6 }, 
                { text: progress.wish.text ? (progress.wish.text.length > 12 ? progress.wish.text.slice(0,10)+"…" : progress.wish.text) : "我的愿望", matchId: 7 }
            ] }
        ];
        let currentLevel = 0;
        let cards = [];
        let flippedIndex = null;
        let lockBoard = false;
        let matchedCount = 0;

        function initLevel() {
            const level = levels[currentLevel];
            let newCards = [];
            level.pairs.forEach((item, idx) => {
                newCards.push({ id: idx*2, text: item.text, matchId: item.matchId, flipped: false, matched: false });
                newCards.push({ id: idx*2+1, text: item.text, matchId: item.matchId, flipped: false, matched: false });
            });
            for (let i = newCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newCards[i], newCards[j]] = [newCards[j], newCards[i]];
            }
            cards = newCards;
            flippedIndex = null;
            lockBoard = false;
            matchedCount = cards.filter(c => c.matched).length;
            renderGame();
        }

        function handleCardClick(idx) {
            if (lockBoard) return;
            if (cards[idx].matched) return;
            if (flippedIndex === idx) return;
            if (flippedIndex === null) {
                cards[idx].flipped = true;
                flippedIndex = idx;
                renderGame();
                return;
            }
            cards[idx].flipped = true;
            lockBoard = true;
            renderGame();
            const card1 = cards[flippedIndex];
            const card2 = cards[idx];
            if (card1.matchId === card2.matchId) {
                card1.matched = true;
                card2.matched = true;
                card1.flipped = true;
                card2.flipped = true;
                matchedCount += 2;
                flippedIndex = null;
                lockBoard = false;
                renderGame();
                if (matchedCount === cards.length) {
                    if (currentLevel === 0) {
                        showModal("🎉 第一关通过！进入第二关，挑战更多财商概念！", () => {
                            currentLevel = 1;
                            initLevel();
                        });
                    } else {
                        showModal("🎉 太棒了！你记住了所有关键财商概念！", () => {
                            progress.islandCompleted[1] = true;
                            progress.badges++;
                            progress.islandUnlocked[2] = true;
                            progress.currentChallenge = null;
                            saveProgress();
                            render();
                        });
                    }
                }
            } else {
                setTimeout(() => {
                    cards[flippedIndex].flipped = false;
                    cards[idx].flipped = false;
                    flippedIndex = null;
                    lockBoard = false;
                    renderGame();
                }, 800);
            }
        }

        function renderGame() {
            const level = levels[currentLevel];
            container.innerHTML = `
                <div class="story-bubble"><span>🐕</span><span>🧠 记忆丛林 · 翻翻乐！配对成功卡片会变成小狗🐕！</span></div>
                <h2>📔 ${level.name} (${matchedCount/2}/${cards.length/2} 对)</h2>
                <div class="game-area">
                    <div class="memory-grid" id="memoryGrid" style="grid-template-columns: repeat(${level.gridCols}, 1fr);"></div>
                    <div class="flex-btns">
                        <button id="resetLevelBtn">🔄 重玩本关</button>
                        <button id="backMapBtn">🗺️ 返回地图</button>
                    </div>
                </div>
            `;
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            cards.forEach((card, idx) => {
                const div = document.createElement('div');
                div.className = `memory-card ${card.flipped || card.matched ? 'flipped' : ''} ${card.matched ? 'matched' : ''}`;
                div.innerText = card.matched ? '🐕' : (card.flipped ? card.text : '?');
                div.onclick = () => handleCardClick(idx);
                grid.appendChild(div);
            });
            document.getElementById('resetLevelBtn').onclick = () => { initLevel(); };
            document.getElementById('backMapBtn').onclick = () => {
                progress.currentChallenge = null;
                saveProgress();
                render();
            };
        }
        initLevel();
    }

    // 金蛋河湾
    function renderGoldenEggGame(container) {
        let gameActive = true;
        let clickCount = 0;
        let timeLeft = 5;
        let timerInterval = null;

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function startGame() {
            gameActive = true;
            clickCount = 0;
            timeLeft = 5;
            updateUI();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                if (timeLeft <= 0) {
                    stopTimer();
                    if (clickCount >= 30) {
                        showModal("只有养好大鹅，才会有更多收入。", () => {
                            progress.islandCompleted[2] = true;
                            progress.badges++;
                            progress.islandUnlocked[3] = true;
                            progress.currentChallenge = null;
                            saveProgress();
                            render();
                        });
                    } else {
                        showModal(`😭 只点击了${clickCount}次，没能赶走怪兽。再试一次！`, () => {
                            startGame();
                        });
                    }
                    gameActive = false;
                } else {
                    timeLeft -= 0.1;
                    if (timeLeft < 0) timeLeft = 0;
                    updateUI();
                }
            }, 100);
        }

        function handleMonsterClick() {
            if (!gameActive) return;
            clickCount++;
            updateUI();
            const monsterDiv = document.getElementById('monsterBtn');
            if (monsterDiv) {
                monsterDiv.style.transform = 'scale(0.96)';
                setTimeout(() => { if(monsterDiv) monsterDiv.style.transform = ''; }, 100);
            }
        }

        function updateUI() {
            const countSpan = document.getElementById('clickCount');
            if (countSpan) countSpan.innerText = clickCount;
            const timeSpan = document.getElementById('timeLeft');
            if (timeSpan) timeSpan.innerText = timeLeft.toFixed(1);
            const fill = document.getElementById('timerFill');
            if (fill) fill.style.width = `${(timeLeft / 5) * 100}%`;
            const needSpan = document.getElementById('needCount');
            if (needSpan) needSpan.innerText = Math.max(0, 30 - clickCount);
        }

        container.innerHTML = `
            <div class="story-bubble"><span>🐕</span><span>🥚 金蛋河湾 · 快点点怪兽！保护大鹅！5秒内点击怪兽30次，赶走它！</span></div>
            <h2>🦢 保护大鹅 · 快点点怪兽</h2>
            <div class="game-area">
                <div class="click-game">
                    <div class="monster-btn" id="monsterBtn">👹💸</div>
                    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
                    <p style="font-size:1.2rem;">点击次数: <strong id="clickCount">0</strong> / 30</p>
                    <p>剩余时间: <span id="timeLeft">5.0</span> 秒</p>
                    <p>还差 <span id="needCount">30</span> 次！</p>
                    <div class="flex-btns">
                        <button id="resetGameBtnInner">🔄 重新挑战</button>
                        <button id="backMapBtn">🗺️ 返回地图</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('monsterBtn').addEventListener('click', handleMonsterClick);
        document.getElementById('resetGameBtnInner').onclick = () => { stopTimer(); startGame(); };
        document.getElementById('backMapBtn').onclick = () => {
            stopTimer();
            progress.currentChallenge = null;
            saveProgress();
            render();
        };
        startGame();
    }

    // 规划神殿
    function renderPlanningTemple(container) {
        const wish = progress.wish;
        const allCollected = Object.values(progress.swordsCollected).every(v => v === true);
        
        if (!progress.planningConfirmed) {
            container.innerHTML = `
                <div class="story-bubble"><span>🐕</span><span>🏛️ 规划神殿 · 回顾你的初心。</span></div>
                <h2>🏛️ 你的愿望</h2>
                <div class="card">
                    <p><strong>✨ 愿望：</strong> ${escapeHtml(wish.text)}</p>
                    <p><strong>📖 原因：</strong> ${escapeHtml(wish.reason)}</p>
                </div>
                <p>现在，请你郑重回答：你是否愿意为了实现这个愿望，坚持存钱和记录成功日记？</p>
                <div class="flex-btns">
                    <button id="agreeBtn" class="primary">是的，我愿意！</button>
                    <button id="disagreeBtn">我还没想好</button>
                </div>
                <button id="backMapBtn" style="margin-top: 10px;">🗺️ 返回地图</button>
            `;
            document.getElementById('agreeBtn').onclick = () => {
                progress.planningConfirmed = true;
                saveProgress();
                renderPlanningTemple(container);
            };
            document.getElementById('disagreeBtn').onclick = () => {
                showModal("没关系，等你准备好随时回来。钱钱会一直等你。", () => {
                    progress.currentChallenge = null;
                    saveProgress();
                    render();
                });
            };
            document.getElementById('backMapBtn').onclick = () => {
                progress.currentChallenge = null;
                saveProgress();
                render();
            };
            return;
        }
        
        const swords = [
            { name: "梦想相册", rule: "用图片具象心愿，持续强化存钱实现目标的动力。" },
            { name: "梦想储蓄罐", rule: "专款单独储蓄，资金只用于对应梦想，不随意挪用。" },
            { name: "成功日记", rule: "每日记录做成的小事，积累自信，破除赚钱畏难心理。" },
            { name: "72小时法则", rule: "确定要做的事三天内落地起步，避免想法无限拖延作废。" },
            { name: "金鹅定律", rule: "留存本金当作生钱的鹅，只花费投资收益，绝不动用本金。" },
            { name: "负债原则", rule: "停止新增消费类借贷，仅偿还账单最低额度，优先留存储蓄。" },
            { name: "中性放大器", rule: "金钱本身无善恶，只会放大持有者原本的品性与生活方式。" }
        ];
        
        container.innerHTML = `
            <div class="story-bubble"><span>🐕</span><span>🏛️ 规划神殿 · 你已许下承诺。现在，请收下这7把财商利剑！</span></div>
            <h2>⚔️ 七把利剑 · 点击收下</h2>
            <div class="swords-grid" id="swordsGrid"></div>
            ${allCollected ? '<button id="completeBtn" class="primary">✨ 完成仪式，成为财商骑士</button>' : '<p style="text-align:center; margin-top:10px;">👈 点击每一把剑，学习它的力量！</p>'}
            <button id="backMapBtn" style="margin-top: 10px;">🗺️ 返回地图</button>
        `;
        
        const grid = document.getElementById('swordsGrid');
        swords.forEach(sword => {
            const collected = progress.swordsCollected[sword.name];
            const div = document.createElement('div');
            div.className = `sword-card ${collected ? 'collected' : ''}`;
            div.innerHTML = `<div class="sword-name">⚔️ ${sword.name}</div><div class="sword-desc">${collected ? '✓ 已收下' : '点击查看规则'}</div>`;
            if (!collected) {
                div.onclick = () => {
                    showSwordDetail(sword.name, sword.rule, () => {
                        progress.swordsCollected[sword.name] = true;
                        saveProgress();
                        renderPlanningTemple(container);
                    });
                };
            }
            grid.appendChild(div);
        });
        
        if (allCollected) {
            document.getElementById('completeBtn').onclick = () => {
                progress.islandCompleted[3] = true;
                progress.badges++;
                progress.currentChallenge = null;
                saveProgress();
                showModal("你已集齐七把利剑！财商骑士之路正式开启！", () => {
                    render();
                });
            };
        }
        
        document.getElementById('backMapBtn').onclick = () => {
            progress.currentChallenge = null;
            saveProgress();
            render();
        };
    }

    // 胜利总结
    async function renderVictory(container) {
        const wish = progress.wish;
        container.innerHTML = `
            <div class="story-bubble"><span>🐕‍🦺🏆</span><span>伟大的财商骑士 ${escapeHtml(progress.userName)}！你完成了所有冒险，获得了最终勇气徽章。</span></div>
            <div style="text-align:center; font-size:3rem;">🏆✨</div>
            <h2>🏆 冒险总结</h2>
            <div class="card"><strong>✨ 最重要的愿望</strong><br>${escapeHtml(wish.text)}<br>—— ${escapeHtml(wish.reason)}</div>
            <div class="card"><strong>🧠 记忆丛林</strong><br>你记住了作者、书名、开发者和财商概念，知识+1</div>
            <div class="card"><strong>🥚 金蛋河湾</strong><br>你保护了大鹅，明白了养鹅的重要性</div>
            <div class="card"><strong>🗺️ 规划神殿</strong><br>你收下了七把利剑，财商骑士之路已开启</div>
            <p>✨ 你已经完成了《小狗钱钱》财商冒险之旅！记住钱钱的话：从专注自己能做、已知、拥有的事物那一刻起，成功就已经启程。</p>
            <div class="flex-btns">
                <button id="shareBtn">🎨 生成冒险海报</button>
                <button id="resetAllBtn">🔄 重新开始冒险</button>
            </div>
        `;
        document.getElementById('shareBtn').onclick = async () => {
            const posterDiv = document.createElement('div');
            posterDiv.style.cssText = 'background:white; width:400px; padding:20px; border:4px solid black; font-family:monospace;';
            posterDiv.innerHTML = container.cloneNode(true).innerHTML;
            document.body.appendChild(posterDiv);
            const canvas = await html2canvas(posterDiv, { scale:2, backgroundColor:'#FFFFFF' });
            const link = document.createElement('a');
            link.download = 'puppy_money_poster.png';
            link.href = canvas.toDataURL();
            link.click();
            document.body.removeChild(posterDiv);
        };
        document.getElementById('resetAllBtn').onclick = () => {
            if (bgm) { bgm.pause(); bgmPlaying = false; bgmMuted = false; }
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        };
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;');
    }

    // 音乐控制按钮监听
    document.getElementById('musicControlBtn').addEventListener('click', () => {
        toggleMusic();
    });

    loadProgress();
    render();
</script>
</body>
